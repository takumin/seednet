---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  build:
    taskfile: build.task.yml
    internal: true
  tool:
    taskfile: tool.task.yml
    internal: true

tasks:
  # Boots guests with seednet on cloud-hypervisor and checks their network (see e2e/all.sh and
  # e2e/run.sh), the guests at once. Not part of the default `task all`: it needs the tools that
  # e2e/run.sh lists, and takes minutes. Some guests only: task e2e -- debian-nm-networkd el10-nm-nm
  default:
    desc: '{{.TASK}}'
    deps:
    - task: binary
    - task: tool:aqua:tag:cloud-hypervisor
    cmds:
    - e2e/all.sh {{.CLI_ARGS}}

  # One guest: task e2e:run DISTRO=debian INITRD=nm BACKEND=networkd SCENARIO=live
  run:
    desc: '{{.TASK}}'
    requires:
      vars: [DISTRO, INITRD, BACKEND, SCENARIO]
    deps:
    - task: binary
    - task: tool:aqua:tag:cloud-hypervisor
    cmds:
    - e2e/run.sh {{.DISTRO}} {{.INITRD}} {{.BACKEND}} {{.SCENARIO}}

  binary:
    internal: true
    cmds:
    - task: build:build
      vars:
        PROFILE: release
        TARGET: '{{ARCH | replace "amd64" "x86_64" | replace "arm64" "aarch64"}}-unknown-linux-musl'
