---
name: E2E
on:
  workflow_call:
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/.aqua/aqua.yaml
jobs:
  e2e:
    name: ${{ matrix.guest }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each architecture boots guests of its own, with KVM, as e2e/all.sh lists them.
        runner:
        - ubuntu-26.04
        - ubuntu-26.04-arm
        guest:
        - debian-networkd-networkd
        - debian-networkd-nm
        - debian-nm-networkd
        - debian-nm-nm
        - ubuntu-networkd-networkd
        - ubuntu-nm-nm
        - fedora-networkd-networkd
        - fedora-nm-nm
        - el9-nm-nm
        - el10-nm-nm
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup KVM
      run: |-
        if [ ! -e /dev/kvm ]; then
          echo "::error::this runner has no KVM"
          exit 1
        fi
        sudo chmod 0666 /dev/kvm
    - name: Setup tools
      run: |-
        # The tests make network namespaces without root, which AppArmor would keep them from.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          podman uidmap passt dosfstools mtools xorriso squashfs-tools e2fsprogs openssl python3 zstd
    - name: Setup aqua
      uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.64.0
    - name: Setup cloud-hypervisor
      run: aqua install -t cloud-hypervisor
    - name: Download seednet
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: seednet-release-*
        merge-multiple: true
    - name: Place seednet
      run: |-
        target=$(uname -m)-unknown-linux-musl
        (cd dist && sha256sum -c "seednet-release-${target}.sha256sum")
        install -D -m 0755 "dist/seednet-release-${target}" "target/${target}/release/seednet"
    - name: E2E
      run: e2e/all.sh "${GUEST}"
      env:
        GUEST: ${{ matrix.guest }}
        E2E_JOBS: '1'
    - name: Upload logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-${{ matrix.guest }}-${{ matrix.runner }}
        path: |-
          target/e2e/${{ matrix.guest }}/*.log
        if-no-files-found: ignore
