[package]
name = "seednet-cli"
description = "The seednet command, which finds the network-config for this boot and writes the systemd-networkd or NetworkManager files"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "seednet"
path = "src/main.rs"
# The library is also named seednet, and their docs would land on the same path.
doc = false

[dependencies]
seednet.workspace = true
anyhow.workspace = true
clap.workspace = true
rustix.workspace = true
rustls.workspace = true
ureq.workspace = true
yaml_serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
