[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Takumi Takahashi <takumiiinn@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
# Distributed as static binaries on GitHub Releases, for an initrd.
publish = false
homepage = "https://github.com/takumin/seednet"
repository = "https://github.com/takumin/seednet"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
base64 = "0.23.1"
flate2 = "1.1.10"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"

# The binary goes into an initrd, so keep it small.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
